# Base44 sandbox environment for the projects-templates monorepo.
#
# This repo is a collection of independent starter apps. The preview entry point
# (host port 3000) runs the repo's default one-time-payment template,
# nextjs_one_time_payment_golden-path, as a live Next.js dev server over the
# bind-mounted source so edits show up immediately.
#
# Other templates can be previewed by copying the `web` service, changing
# `working_dir`, the host port, `base44.port`, and the `--port` flag, and adding
# that port to the template's next.config.ts allowedDevOrigins.

services:
  web:
    image: node:22-bookworm-slim
    labels:
      base44.project: "Next.js One-time Payment Starter (golden-path)"
      base44.kind: "web"
      base44.port: "3000"
    working_dir: /app/nextjs_one_time_payment_golden-path
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - web_node_modules:/app/nextjs_one_time_payment_golden-path/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      # Passed through from the sandbox so the app can gate preview-only config.
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - NEXT_TELEMETRY_DISABLED=1
      # Bind mounts can swallow inotify events; poll so hot reload keeps working.
      - WATCHPACK_POLLING=true
    # No package-lock.json is committed in this repo, so install from the
    # manifest on start (into the node_modules volume) then run the dev server.
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev -- --port 3000 --hostname 0.0.0.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 240s
    restart: on-failure

volumes:
  web_node_modules:
